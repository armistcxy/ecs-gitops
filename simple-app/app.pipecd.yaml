apiVersion: pipecd.dev/v1beta1
kind: Application
spec:
  name: simple-app
  plugin: ecs
  deployTarget: ecs-dev
  labels:
    env: demo
    plugin: ecs
  plugins:
    ecs:
      input:
        serviceDefinitionFile: servicedef.yaml
        taskDefinitionFile: taskdef.yaml
  # planner:
  #   autoRollback: false # disable auto adding rollback stage for each deployment
  pipeline:
    stages:
      - name: ECS_SYNC
  description: |
    Simple ECS Plugin Demo Application

