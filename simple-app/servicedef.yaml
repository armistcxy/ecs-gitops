cluster: arn:aws:ecs:us-east-1:992382718026:cluster/pipecd-ecs-test-cluster
serviceName: ecs-sv-test
taskDefinition: pipecd-ecs-test
desiredCount: 2
tags:
  - key: "Environment"
    value: "test"
deploymentConfiguration:
  maximumPercent: 200
  minimumHealthyPercent: 0
  strategy: CANARY
  canaryConfiguration:
    canaryPercent: 20.0
    canaryBakeTimeInMinutes: 5
