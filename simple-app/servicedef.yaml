  deploymentCircuitBreaker:
    enable: true
    rollback: true
schedulingStrategy: REPLICA
deploymentController:
  type: ECS
enableECSManagedTags: true
propagateTags: TASK_DEFINITION
launchType: FARGATE
networkConfiguration:
  awsvpcConfiguration:
    assignPublicIp: ENABLED
    securityGroups:
      - sg-0a17a054155fe56de
    subnets:
      - subnet-06ad2d6513d48f198
      - subnet-00293b69820d79561
loadBalancers:
  - targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:992382718026:targetgroup/ecs-canary-blue/becc353a8e09cbec
    containerName: app
    containerPort: 8080
    advancedConfiguration:
      alternateTargetGroupArn: arn:aws:elasticloadbalancing:us-east-1:992382718026:targetgroup/ecs-canary-green/266366f2f3e71d03
      productionListenerRule: arn:aws:elasticloadbalancing:us-east-1:992382718026:listener-rule/app/ecs-canary-alb/a6fd20e4fadb24d3/cc2e25d098780ce6/3120791d16647f43
      roleArn: arn:aws:iam::992382718026:role/ecs-blue-green-role